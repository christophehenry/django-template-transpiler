[package]
name = "django-template-transpiler"
version = "0.0.1"
edition = "2024"

[lib]
name = "django_template_transpiler"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.0", features = ["num-bigint"] }
regex = "1.11.2"
oxc = { version = "0.98.0", features = ["full"] }
dtl-lexer = { git = "https://github.com/LilyFirefly/django-rusty-templates", rev = "0cb2b1e62128438a93cbf36de97ae2e705919d32" }
num-bigint = "0.4.6"
